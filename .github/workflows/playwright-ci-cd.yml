name: Playwright CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      target:
        description: 'Test target'
        required: true
        default: 'both'
        type: choice
        options:
          - playwright
          - browserstack
          - both

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  playwright-tests:
    name: Playwright Tests
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'local' || inputs.target == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  browserstack-tests:
    name: BrowserStack Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: playwright-tests
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'browserstack' || inputs.target == 'both')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run BrowserStack tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          BROWSERSTACK_BUILD_NAME: '${{ github.repository }} - ${{ github.workflow }}'
        run: npm run test:browserstack

      - name: Upload BrowserStack/Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: CI Quality Gate
    if: always()
    runs-on: ubuntu-latest
    needs: [playwright-tests, browserstack-tests]
    steps:
      - name: Evaluate test jobs
        run: |
          echo "Playwright tests: ${{ needs.playwright-tests.result }}"
          echo "BrowserStack tests: ${{ needs.browserstack-tests.result }}"

          if [[ "${{ needs.playwright-tests.result }}" == "failure" || "${{ needs.browserstack-tests.result }}" == "failure" ]]; then
            echo "One or more test jobs failed."
            exit 1
          fi

          echo "CI quality gate passed."
