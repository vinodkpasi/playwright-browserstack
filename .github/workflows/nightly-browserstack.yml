name: Nightly BrowserStack Regression

on:
  schedule:
    - cron: '30 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: BrowserStack Regression
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run BrowserStack regression
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          BROWSERSTACK_BUILD_NAME: '${{ github.repository }} - Nightly Regression'
        run: npm run test:browserstack

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-browserstack-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
